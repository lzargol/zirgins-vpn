name: Build Zirgins VPN APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clone Mihomo Core
        run: |
          rm -rf core/Clash.Meta
          git clone --depth 1 -b FlClash https://github.com/chen08209/Clash.Meta.git core/Clash.Meta

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: '3.44.4'
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Get Dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Build APK Package
        run: |
          dart setup.dart android --env stable -v

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZirginsVPN-Android-APKs
          path: ./dist
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: Zirgins VPN Release ${{ github.ref_name }}
          body: "Official release of Zirgins VPN for Android with 70+ Russian bypass applications."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
