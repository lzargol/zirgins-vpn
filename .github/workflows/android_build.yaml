name: Build Zirgins VPN APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Prepare env.json and Get Dependencies
        run: |
          echo '{"APP_ENV": "stable"}' > env.json
          flutter pub get

      - name: Build APK Release (ARM64)
        run: |
          flutter build apk --release --target-platform android-arm64 --dart-define-from-file=env.json --android-skip-build-dependency-validation

      - name: Build APK Release (Universal)
        run: |
          flutter build apk --release --dart-define-from-file=env.json --android-skip-build-dependency-validation

      - name: Prepare Output Directory
        run: |
          mkdir -p dist
          find build/app/outputs/flutter-apk/ -name "*.apk"
          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/ZirginsVPN-arm64.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk dist/ZirginsVPN-universal.apk
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZirginsVPN-Android-APKs
          path: dist/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: Zirgins VPN Release ${{ github.ref_name }}
          body: "Official release of Zirgins VPN for Android with 70+ Russian bypass applications."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
